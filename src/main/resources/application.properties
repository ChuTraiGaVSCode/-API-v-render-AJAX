server.port=8080

spring.application.name=category-product-api

# ====== Database (SQL Server) ======
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CosmeticDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=60021051
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ====== Upload file ======
storage.location=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ====== Swagger3 (springdoc-openapi) ======
# Truy cap: http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs